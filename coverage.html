<body class="coverage-page">
  <header>
    <img class="site-logo" src="image/site.png" width="480" height="480" alt="">
    <div>
      <h1><button id="map-guide-open" class="site-info-trigger" type="button" aria-haspopup="dialog" aria-label="このサイトの見方を開く"><span>OSM What’s New Japan</span></button></h1>
      <small>OpenStreetMap 新着・更新POIダッシュボード</small>
    </div>
    <button class="header-menu-toggle" type="button" aria-expanded="false" aria-controls="header-view-tabs" aria-label="画面メニューを開く">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <nav id="header-view-tabs" class="header-view-tabs" aria-label="画面切り替え">
      <a class="header-view-tab" href="index.html">地図</a>
      <a class="header-view-tab" href="details.html">分析</a>
      <a class="header-view-tab" href="coverage.html" aria-current="page">密度</a>
      <a class="header-view-tab" href="profile.html">マッパー</a>
    </nav>
  </header>
  <main>
    <div id="map" class="map-surface" aria-label="約1kmタイルごとの対象地物密度"></div>
    <section class="panel map-overlay-panel" aria-labelledby="panel-title">
      <h2 id="panel-title" class="region-summary-title">更新密度（約1kmメッシュ）</h2>
      <div class="controls">
        <label for="days">対象期間</label>
        <select id="days" class="form-select">
          <option value="7">直近1週間</option>
          <option value="14" selected>直近2週間</option>
          <option value="30">直近30日</option>
          <option value="90">直近3ヶ月</option>
          <option value="183">直近半年</option>
          <option value="365">直近1年</option>
        </select>
      </div>
      <p id="status" role="status" aria-live="polite">データを読み込んでいます…</p>
      <div class="legend" aria-label="タイル内の対象地物数">
        <span class="is-transparent" style="--color:transparent">0件</span>
        <span style="--color:#e5f5e0">1件</span>
        <span style="--color:#bae4b3">2～4件</span>
        <span style="--color:#74c476">5～7件</span>
        <span style="--color:#31a354">8～9件</span>
        <span style="--color:#006d2c">10件以上</span>
      </div>
      <p id="zoom-notice" class="notice">もっとズームしてください</p>
    </section>
  </main>

  <script src="https://unpkg.com/maplibre-gl@5.12.0/dist/maplibre-gl.js"></script>
  <script src="modal.js?v=20260814-7"></script>
  <script src="help.js?v=20261025-1"></script>
  <script src="map-view.js?v=20260811-1"></script>
  <script>
    'use strict';

    const TILE_ZOOM = 15;
    const MIN_DISPLAY_ZOOM = 9;
    const MAX_REQUESTS = 20;
    const PAGE_SIZE = 5000;
    const MAX_ITEMS = MAX_REQUESTS * PAGE_SIZE;
    const SOURCE_ID = 'coverage-tiles';
    const FILL_LAYER_ID = 'coverage-fill';
    const LINE_LAYER_ID = 'coverage-line';

    const statusElement = document.querySelector('#status');
    const daysSelect = document.querySelector('#days');
    const zoomNotice = document.querySelector('#zoom-notice');
    let apiUrl = '';
    let tileCounts = new Map();
    let truncated = false;

    const emptyFeatureCollection = () => ({type: 'FeatureCollection', features: []});
    const initialMapView = window.osmSharedMapView.read({
      fallbackCenter: [137.2, 36.2],
      fallbackZoom: 5,
      minZoom: 2,
      maxZoom: 18,
    });

    const map = new maplibregl.Map({
      container: 'map',
      center: initialMapView.center,
      zoom: initialMapView.zoom,
      minZoom: 2,
      maxZoom: 18,
      maxBounds: [[118, 18], [158, 60]],
      style: './tiles/osmfj_poi.json',
      locale: window.osmSharedMapControls.locale,
    });
    window.osmSharedMapControls.add(map);
    window.osmSharedMapView.bind(map);

    function longitudeToTileX(longitude, zoom = TILE_ZOOM) {
      return Math.floor((longitude + 180) / 360 * (2 ** zoom));
    }

    function latitudeToTileY(latitude, zoom = TILE_ZOOM) {
      const limited = Math.max(-85.05112878, Math.min(85.05112878, latitude));
      const radians = limited * Math.PI / 180;
      return Math.floor(
        (1 - Math.asinh(Math.tan(radians)) / Math.PI) / 2 * (2 ** zoom),
      );
    }

    function tileXToLongitude(x, zoom = TILE_ZOOM) {
      return x / (2 ** zoom) * 360 - 180;
    }

    function tileYToLatitude(y, zoom = TILE_ZOOM) {
      const mercator = Math.PI * (1 - 2 * y / (2 ** zoom));
      return Math.atan(Math.sinh(mercator)) * 180 / Math.PI;
    }

    function tileKey(x, y) {
      return `${x}/${y}`;
    }

    function tilePolygon(x, y, count) {
      const west = tileXToLongitude(x);
      const east = tileXToLongitude(x + 1);
      const north = tileYToLatitude(y);
      const south = tileYToLatitude(y + 1);
      return {
        type: 'Feature',
        properties: {
          x,
          y,
          count,
          tile: `${TILE_ZOOM}/${x}/${y}`,
        },
        geometry: {
          type: 'Polygon',
          coordinates: [[
            [west, north],
            [east, north],
            [east, south],
            [west, south],
            [west, north],
          ]],
        },
      };
    }

    function visibleTiles() {
      if (map.getZoom() < MIN_DISPLAY_ZOOM) return emptyFeatureCollection();
      const bounds = map.getBounds();
      const maximumTile = (2 ** TILE_ZOOM) - 1;
      const westX = Math.max(0, longitudeToTileX(bounds.getWest()));
      const eastX = Math.min(maximumTile, longitudeToTileX(bounds.getEast()));
      const northY = Math.max(0, latitudeToTileY(bounds.getNorth()));
      const southY = Math.min(maximumTile, latitudeToTileY(bounds.getSouth()));
      const features = [];

      for (let x = westX; x <= eastX; x++) {
        for (let y = northY; y <= southY; y++) {
          features.push(tilePolygon(x, y, tileCounts.get(tileKey(x, y)) || 0));
        }
      }
      return {type: 'FeatureCollection', features};
    }

    function updateVisibleTiles() {
      zoomNotice.hidden = map.getZoom() >= MIN_DISPLAY_ZOOM;
      const source = map.getSource(SOURCE_ID);
      if (!source) return;
      source.setData(visibleTiles());
    }

    async function readJsonc(url) {
      const response = await fetch(url);
      if (!response.ok) throw new Error(`${url}: HTTP ${response.status}`);
      const source = await response.text();
      return JSON.parse(source.split(/\r?\n/)
        .filter(line => !/^\s*\/\//.test(line))
        .join('\n'));
    }

    async function readJson(url) {
      const response = await fetch(url);
      if (!response.ok) throw new Error(`API: HTTP ${response.status}`);
      return response.json();
    }

    async function loadRows() {
      const rows = [];
      let cursor = '';
      truncated = false;

      for (let request = 0; request < MAX_REQUESTS; request++) {
        const query = new URLSearchParams({
          mode: 'pois',
          days: daysSelect.value,
          limit: String(PAGE_SIZE),
        });
        if (cursor) query.set('cursor', cursor);

        const data = await readJson(`${apiUrl}?${query}`);
        const batch = Array.isArray(data.items) ? data.items : [];
        rows.push(...batch);
        statusElement.textContent = `${rows.length.toLocaleString('ja-JP')}件を読み込んでいます…`;
        cursor = String(data.meta?.nextCursor || '');
        if (!cursor) return rows;
      }

      truncated = Boolean(cursor);
      return rows;
    }

    function aggregateRows(rows) {
      const counts = new Map();
      for (const row of rows) {
        const longitude = Number(row.lon);
        const latitude = Number(row.lat);
        if (!Number.isFinite(longitude) || !Number.isFinite(latitude)) continue;
        const key = tileKey(
          longitudeToTileX(longitude),
          latitudeToTileY(latitude),
        );
        counts.set(key, (counts.get(key) || 0) + 1);
      }
      return counts;
    }

    function formatJstDate(value) {
      const date = new Date(`${String(value).replace(' ', 'T')}Z`);
      if (!Number.isFinite(date.getTime())) return '';
      return new Intl.DateTimeFormat('ja-JP', {
        timeZone: 'Asia/Tokyo',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
      }).format(date);
    }

    function loadedDateRange(rows) {
      const dates = rows
        .map(row => String(row.date || ''))
        .filter(Boolean)
        .sort();
      if (!dates.length) return '';
      return `（${formatJstDate(dates[0])}～${formatJstDate(dates[dates.length - 1])}）`;
    }

    async function reload() {
      daysSelect.disabled = true;
      statusElement.textContent = 'データを読み込んでいます…';

      try {
        if (!apiUrl) {
          const configuration = await readJsonc('data/config.jsonc');
          try {
            const resolvedApiUrl = new URL(String(configuration.apiUrl || '').trim(), window.location.href);
            if (!/^https?:$/.test(resolvedApiUrl.protocol)) throw new Error();
            apiUrl = resolvedApiUrl.href;
          } catch {
            throw new Error('data/config.jsoncのapiUrlはHTTP(S)の相対URLまたは絶対URLを指定してください。');
          }
        }

        const rows = await loadRows();
        tileCounts = aggregateRows(rows);
        updateVisibleTiles();
        const suffix = truncated
          ? `（上限${MAX_ITEMS.toLocaleString('ja-JP')}件。結果は参考値です）`
          : '';
        const dateRange = loadedDateRange(rows);
        statusElement.textContent =
          `${rows.length.toLocaleString('ja-JP')}件${dateRange}・${tileCounts.size.toLocaleString('ja-JP')}タイル ${suffix}`;
      } catch (error) {
        console.error(error);
        statusElement.textContent = `読み込みに失敗しました：${error.message}`;
      } finally {
        daysSelect.disabled = false;
      }
    }

    map.on('load', () => {
      map.addSource(SOURCE_ID, {
        type: 'geojson',
        data: emptyFeatureCollection(),
      });
      map.addLayer({
        id: FILL_LAYER_ID,
        type: 'fill',
        source: SOURCE_ID,
        paint: {
          'fill-color': [
            'step',
            ['get', 'count'],
            'rgba(0,0,0,0)',
            1, '#e5f5e0',
            2, '#bae4b3',
            5, '#74c476',
            8, '#31a354',
            10, '#006d2c',
          ],
          'fill-opacity': ['step', ['get', 'count'], 0, 1, 0.52],
        },
      });
      map.addLayer({
        id: LINE_LAYER_ID,
        type: 'line',
        source: SOURCE_ID,
        paint: {
          'line-color': '#4b5d55',
          'line-width': 0.6,
          'line-opacity': 0.3,
        },
      });
      updateVisibleTiles();
      reload();
    });

    map.on('moveend', updateVisibleTiles);
    map.on('zoom', () => {
      zoomNotice.hidden = map.getZoom() >= MIN_DISPLAY_ZOOM;
    });

    map.on('mousemove', FILL_LAYER_ID, event => {
      map.getCanvas().style.cursor = event.features?.length ? 'pointer' : '';
    });
    map.on('mouseleave', FILL_LAYER_ID, () => {
      map.getCanvas().style.cursor = '';
    });
    map.on('click', FILL_LAYER_ID, event => {
      const feature = event.features?.[0];
      if (!feature) return;
      const count = Number(feature.properties.count);
      new maplibregl.Popup()
        .setLngLat(event.lngLat)
        .setHTML(
          `<strong>タイル ${feature.properties.tile}</strong><br>`
          + `対象地物：${count.toLocaleString('ja-JP')}件`,
        )
        .addTo(map);
    });

    daysSelect.addEventListener('change', reload);
  </script>
</body>

</html>
